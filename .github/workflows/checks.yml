name: Program checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/run_ci_check.py -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/run_ci_check.py tools/check_browser.py
      - run: python tools/run_ci_check.py tools/check_personal.py
      - run: python tools/run_ci_check.py tools/check_auto_refresh.py
      - run: python tools/run_ci_check.py tools/check_source_connection.py
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t saenong-runtime:local .
      - run: python tools/run_ci_check.py tools/check_container.py
